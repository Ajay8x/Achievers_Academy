<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Accreditations</title>
    <link rel="icon" href="static/Web Logo 1.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <!-- NAVBAR LOAD -->
    <div id="navbar"></div>

    <div class="">
        <h2 class="section-title" style="text-align:center; margin:40px 0 20px;">Affiliation & Recognition</h2>

        <section class="accreditations-section">
            <div class="grid">

                <div class="card">
                    <img src="https://www.whis.edu.in/images/accreditations/6.jpg" alt="CBSE">
                    <h3>CBSE</h3>
                </div>

                <div class="card">
                    <img src="https://www.whis.edu.in/images/accreditations/5.jpg" alt="HSC SSC">
                    <h3>HSC & SSC</h3>
                </div>

                <div class="card">
                    <img src="static/msbte.jfif"
                        alt="NIOS">
                    <h3>MSBTE</h3>
                </div>
                
                 <div class="card">

                    <img src="static/pci.jfif" alt="AS A Level">
                    <h3>PCI</h3>
                </div>



            </div>
        </section>
    </div>
    <style>
        .accreditations-section {
            background-color: #fff;
            padding: 30px;

        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
        }

        .card {
            border: 4px solid #f2c94c;
            padding: 30px 20px;
            background: #fff;
            transition: transform 0.3s ease;

            /* Center content vertically and horizontally */
            display: flex;
            flex-direction: column;
            align-items: center;
            /* horizontal center */
            justify-content: center;
            /* vertical alignment if needed */
            text-align: center;
            /* fallback for text */
        }

        .card img {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
            display: block;
            /* ensures centering in flexbox */
        }


        .card:hover {
            transform: translateY(-5px);
        }

        /* .card img {
                    max-width: 120px;
                    height: auto;
                    margin-bottom: 20px;
                } */

        .card h3 {
            font-size: 18px;
            margin: 0;
            font-weight: bold;
        }

        /* Section Title */
        .section-title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin: 60px 0 40px;
            color: #0f2b71;
        }

        .section-title::after {
            content: "";
            width: 60px;
            height: 4px;
            background: #ec9838;
            display: block;
            margin: 12px auto 0;
            border-radius: 2px;
        }
    </style>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>// Load navbar.html
      

fetch("navbar.html")
.then(res => res.text())
.then(html => {
    document.getElementById("navbar").innerHTML = html;

    initNavbar(); // 🔥 IMPORTANT
});


function initNavbar() {

    /* ================= ACTIVE LINK ================= */
    const currentPage = window.location.pathname.split("/").pop() || "index.html";

    document.querySelectorAll(".nb-link[href]").forEach(link => {
        const href = link.getAttribute("href").split("/").pop();

        if (href === currentPage) {
            link.classList.add("active");
        }
    });


    /* ================= DROPDOWN ================= */
    const items = document.querySelectorAll(".nb-item");

    items.forEach(item => {
        const btn = item.querySelector("button.nb-link");

        if (!btn) return;

        btn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();

            // close others
            items.forEach(i => {
                if (i !== item) i.classList.remove("open");
            });

            // toggle current
            item.classList.toggle("open");
        });
    });


    /* close dropdown on outside click */
    document.addEventListener("click", function () {
        items.forEach(i => i.classList.remove("open"));
    });


    /* ================= MOBILE TOGGLE ================= */
    const hamburger = document.getElementById("hamburger");
    const drawer = document.getElementById("mobileDrawer");

    if (hamburger && drawer) {
        hamburger.addEventListener("click", function () {
            hamburger.classList.toggle("is-open");
            drawer.classList.toggle("open");
        });
    }


    /* ================= MOBILE ACCORDION ================= */
    function setup(btnId, subId) {
        const btn = document.getElementById(btnId);
        const sub = document.getElementById(subId);

        if (!btn || !sub) return;

        btn.addEventListener("click", function () {
            sub.classList.toggle("open");
        });
    }

    setup("mobileResultBtn", "subResult");
    setup("mobileCourseBtn", "subCourses");
}
    </script>
    <script>
        fetch("footer.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>
</body>

</html>
