    <style>
        .page-title {
    text-align: center;
    padding: 60px 20px 40px;
}

.page-title h1 {
    font-size: 36px;
    margin-bottom: 15px;
}

.underline {
    width: 80px;
    height: 3px;
    background: #f6cf57;
    margin: 0 auto;
}



/* ===== GALLERY GRID ===== */
.gallery {
    margin: auto;
    padding: 60px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    background-color: #fff;
}

.gallery-item {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border-radius: 10px;
}

.gallery-item img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
}

.gallery-item:hover img {
    transform: scale(1.05);
}
.gallery-title {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    color: #ec9838;
}
/* Overlay */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    opacity: 0;
    transition: 0.3s ease;
    text-align: center;
    padding: 10px;
}

.gallery-item:hover .overlay {
    opacity: 1;
}

/* Section Title */
.section-title {
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    margin: 60px 0 40px;
    color: #0f2b71;
}

.section-title::after {
    content: "";
    width: 60px;
    height: 4px;
    background: #ec9838;
    display: block;
    margin: 12px auto 0;
    border-radius: 2px;
}

/* ===== TABLET ===== */
@media (max-width: 992px) {
    .gallery {
        padding: 40px 30px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .gallery-item img {
        height: 200px;
    }
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
    .section-title {
        font-size: 24px;
        margin: 30px 0 20px;
    }

    .gallery {
        padding: 20px;
        gap: 12px;
        grid-template-columns: repeat(2, 1fr);
    }

    .gallery-item img {
        height: 160px;
    }

    .overlay {
        font-size: 18px;
    }
}

/* ===== SMALL MOBILE ===== */
@media (max-width: 480px) {
    .gallery {
        grid-template-columns: 1fr;
        padding: 15px;
    }

    .gallery-item img {
        height: 180px;
    }

    .overlay {
        font-size: 18px;
    }
}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   <script>
fetch("navbar.html")
.then(res => res.text())
.then(html => {
    document.getElementById("navbar").innerHTML = html;

    initNavbar(); // 🔥 IMPORTANT
});


function initNavbar() {

    /* ================= ACTIVE LINK ================= */
    const currentPage = window.location.pathname.split("/").pop() || "index.html";

    document.querySelectorAll(".nb-link[href]").forEach(link => {
        const href = link.getAttribute("href").split("/").pop();

        if (href === currentPage) {
            link.classList.add("active");
        }
    });


    /* ================= DROPDOWN ================= */
    const items = document.querySelectorAll(".nb-item");

    items.forEach(item => {
        const btn = item.querySelector("button.nb-link");

        if (!btn) return;

        btn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();

            // close others
            items.forEach(i => {
                if (i !== item) i.classList.remove("open");
            });

            // toggle current
            item.classList.toggle("open");
        });
    });


    /* close dropdown on outside click */
    document.addEventListener("click", function () {
        items.forEach(i => i.classList.remove("open"));
    });


    /* ================= MOBILE TOGGLE ================= */
    const hamburger = document.getElementById("hamburger");
    const drawer = document.getElementById("mobileDrawer");

    if (hamburger && drawer) {
        hamburger.addEventListener("click", function () {
            hamburger.classList.toggle("is-open");
            drawer.classList.toggle("open");
        });
    }


    /* ================= MOBILE ACCORDION ================= */
    function setup(btnId, subId) {
        const btn = document.getElementById(btnId);
        const sub = document.getElementById(subId);

        if (!btn || !sub) return;

        btn.addEventListener("click", function () {
            sub.classList.toggle("open");
        });
    }

    setup("mobileResultBtn", "subResult");
    setup("mobileCourseBtn", "subCourses");
}
</script>
