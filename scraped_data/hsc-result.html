<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>JEE Result</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #eaeaea;
    color: #333;
}

/* TITLE */
.section-title {
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    margin: 40px 0 20px;
    color: #0f2b71;
}

.section-title::after {
    content: "";
    width: 60px;
    height: 4px;
    background: #ec9838;
    display: block;
    margin: 12px auto 0;
    border-radius: 2px;
}

/* FULLSCREEN IMAGE SECTION */
.result-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    min-height: 75vh;
}

.result-card {
    width: 100%;
    max-width: 1200px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    background: #fff;
    transition: transform 0.3s ease;
}

.result-card:hover {
    transform: scale(1.01);
}

.result-card img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
}

/* MOBILE */
@media (max-width: 768px) {
    .result-wrapper {
        padding: 20px 12px;
        min-height: auto;
    }

    .result-card {
        border-radius: 12px;
    }
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- TITLE -->
<h1 class="section-title">HSC Result</h1>

<!-- FULLSCREEN IMAGE -->
<div class="result-wrapper">
    <div class="result-card">
        <img src="static/result/HSC.jpeg" alt="JEE Result Image">
    </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- NAVBAR LOAD + ACTIVE + DROPDOWN -->
<script>
fetch("navbar.html")
.then(res => res.text())
.then(html => {
    document.getElementById("navbar").innerHTML = html;

    initNavbar(); // 🔥 IMPORTANT
});


function initNavbar() {

    /* ================= ACTIVE LINK ================= */
    const currentPage = window.location.pathname.split("/").pop() || "index.html";

    document.querySelectorAll(".nb-link[href]").forEach(link => {
        const href = link.getAttribute("href").split("/").pop();

        if (href === currentPage) {
            link.classList.add("active");
        }
    });


    /* ================= DROPDOWN ================= */
    const items = document.querySelectorAll(".nb-item");

    items.forEach(item => {
        const btn = item.querySelector("button.nb-link");

        if (!btn) return;

        btn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();

            // close others
            items.forEach(i => {
                if (i !== item) i.classList.remove("open");
            });

            // toggle current
            item.classList.toggle("open");
        });
    });


    /* close dropdown on outside click */
    document.addEventListener("click", function () {
        items.forEach(i => i.classList.remove("open"));
    });


    /* ================= MOBILE TOGGLE ================= */
    const hamburger = document.getElementById("hamburger");
    const drawer = document.getElementById("mobileDrawer");

    if (hamburger && drawer) {
        hamburger.addEventListener("click", function () {
            hamburger.classList.toggle("is-open");
            drawer.classList.toggle("open");
        });
    }


    /* ================= MOBILE ACCORDION ================= */
    function setup(btnId, subId) {
        const btn = document.getElementById(btnId);
        const sub = document.getElementById(subId);

        if (!btn || !sub) return;

        btn.addEventListener("click", function () {
            sub.classList.toggle("open");
        });
    }

    setup("mobileResultBtn", "subResult");
    setup("mobileCourseBtn", "subCourses");
}
</script>

<!-- FOOTER LOAD -->
<script>
fetch("footer.html")
.then(res => res.text())
.then(data => document.getElementById("footer").innerHTML = data);
</script>

</body>
</html>
